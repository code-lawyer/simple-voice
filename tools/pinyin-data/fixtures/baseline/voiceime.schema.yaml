# Rime schema
# encoding: utf-8

schema:
  schema_id: voiceime
  name: 全拼
  version: "1"

engine:
  processors:
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - "derive/^([nl])ue$/$1ve/"
    - "derive/^([jqxy])u/$1v/"

translator:
  dictionary: voiceime
  enable_user_dict: true
  preedit_format:
    - "xform/([nl])v/$1ü/"
    - "xform/([nl])ue/$1üe/"
    - "xform/([jqxy])v/$1ü/"

punctuator:
  import_preset: default

recognizer:
  import_preset: default

key_binder:
  bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: Page_Up, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
    - { when: has_menu, accept: Page_Down, send: Page_Down }
